name: Deploy Frontend

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main, staging]

env:
  NODE_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
  DEPLOY_PATH: ${{ github.ref == 'refs/heads/main' && '/var/www/sagle-frontend-prod' || '/var/www/sagle-frontend-stgn' }}
  VITE_API_URL: ${{ github.ref == 'refs/heads/main' && 'https://api.thesagle.com' || 'https://staging-api.thesagle.com' }}

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install --save-dev @vitejs/plugin-react-swc

      - name: Create type declaration file
        run: |
          mkdir -p src/types
          cat > src/types/modules.d.ts << 'EOF'
          declare module 'canvas-confetti';
          declare module 'react-dom';
          declare module 'react-dom/client';
          declare module '@vitejs/plugin-react-swc';
          EOF

      # Create environment file with proper API URL
      - name: Create environment file
        run: |
          echo "VITE_API_URL=${{ env.VITE_API_URL }}" > .env

      - name: Build project
        run: npm run build

      # Upload the build artifacts to be used in the next job
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      - name: Setup SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS || '' }}

      - name: Add host key to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 146.190.147.241 >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          rsync -avz --delete ./dist/ root@146.190.147.241:${{ env.DEPLOY_PATH }}/

  configure:
    name: Configure Web Server
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Configure Nginx
        uses: appleboy/ssh-action@master
        with:
          host: 146.190.147.241
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            source ~/.profile
            source ~/.bashrc
            
            # Define environment variables
            NGINX_CONFIG_PATH="/etc/nginx/sites-available/default"
            SERVER_NAME="${{ github.ref == 'refs/heads/main' && 'thesagle.com www.thesagle.com' || 'staging.thesagle.com' }}"
            DEPLOY_PATH="${{ env.DEPLOY_PATH }}"

            # Create a backup of current config
            cp $NGINX_CONFIG_PATH ${NGINX_CONFIG_PATH}.bak

            # Check if our server block already exists in the default file
            if grep -q "$SERVER_NAME" $NGINX_CONFIG_PATH; then
              echo "Server block for $SERVER_NAME already exists, updating root path"
              # Update the root path using sed
              sed -i "/server_name $SERVER_NAME/,/location/s|root .*|root $DEPLOY_PATH;|" $NGINX_CONFIG_PATH
            else
              echo "Adding new server block for $SERVER_NAME"
              # Append a new server block to the default config
              cat >> $NGINX_CONFIG_PATH << EOF


            server {
                  listen 80;
                  server_name $SERVER_NAME;
                  
                  root $DEPLOY_PATH;
                  index index.html;
                  
                  location / {
                      try_files \$uri \$uri/ /index.html;
                  }
                  
                  # Enable gzip compression
                  gzip on;
                  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
              }
            EOF
            fi
            
            # Verify the Nginx configuration
            nginx -t
            
            # If verification passes, reload Nginx
            if [ $? -eq 0 ]; then
              systemctl reload nginx
            else
              echo "Nginx configuration is invalid, restoring backup"
              cp ${NGINX_CONFIG_PATH}.bak $NGINX_CONFIG_PATH
              exit 1
            fi
